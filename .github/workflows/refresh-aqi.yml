name: Refresh AQI Cache

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: refresh-aqi-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require production API key
        run: |
          if [ -z "$MOENV_API_KEY" ]; then
            echo "::error::MOENV_API_KEY is not configured; the last-good cache was left unchanged."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch official AQI cache
        run: npm run fetch:aqi

      - name: Validate promoted production cache
        run: npm run validate:aqi

      - name: Commit updated cache
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: refresh AQI cache'
          file_pattern: public/data/aqi-latest.json
