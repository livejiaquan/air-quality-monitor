name: Refresh AQI Cache

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-aqi-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout operational bridge
        uses: actions/checkout@v7
        with:
          path: bridge

      - name: Checkout release branch tip
        uses: actions/checkout@v7
        with:
          ref: codex/unified-visual-refresh
          fetch-depth: 0
          path: release

      - name: Verify release-branch guard tests
        run: node --test bridge/scripts/verify-release-branch.test.mjs

      - name: Require reviewed code and cache-only release descendants
        id: release_guard
        run: |
          node bridge/scripts/verify-release-branch.mjs \
            --repo release \
            --approved-sha 1f68681722b61c401e52e706413691e55a5aab63 \
            --release-branch codex/unified-visual-refresh \
            --allow-path public/data/aqi-latest.json
          echo "release_sha=$(git -C release rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: release/package-lock.json

      - name: Install dependencies
        working-directory: release
        run: npm ci

      - name: Fetch official AQI cache
        working-directory: release
        run: npm run fetch:aqi
        env:
          # The existing secret is scoped to this server-side fetch process only.
          MOENV_API_KEY: ${{ secrets.API_KEY }}

      - name: Validate promoted production cache
        working-directory: release
        run: npm run validate:aqi

      - name: Verify application and release artifact
        working-directory: release
        run: |
          npm run test
          npm run typecheck
          npm run lint
          npm run build
          if [ -e dist/js/config.js ]; then
            echo "::error::Release artifact contains the retired legacy client config path."
            exit 1
          fi
          if rg -n -i '(api[_-]?key\s*[:=]|authorization\s*[:=]|bearer\s+[A-Za-z0-9._~-]{12,})' dist --glob '!**/*.map'; then
            echo "::error::Release artifact contains a credential assignment or bearer token signature."
            exit 1
          fi
          node scripts/validate-aqi-cache.mjs dist/data/aqi-latest.json

      - name: Commit refreshed cache if the release tip stayed unchanged
        working-directory: release
        env:
          START_SHA: ${{ steps.release_guard.outputs.release_sha }}
        run: |
          RELEASE_BRANCH=codex/unified-visual-refresh
          git add public/data/aqi-latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')"
          if [ "$REMOTE_SHA" != "$START_SHA" ]; then
            echo "::error::Release branch moved during refresh; cache was not pushed."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh AQI cache"
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: release/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
