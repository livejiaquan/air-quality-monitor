name: Build and Deploy

# Single production pipeline: fetch the official AQI snapshot server-side,
# verify it and the app, then publish dist/ to GitHub Pages. The snapshot is
# baked into the Pages artifact only — it is never committed back, so the
# history stays free of hourly bot commits and the API key never reaches the
# browser bundle. Any failure leaves the previous deployment online.

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # GitHub treats schedules as best effort (real gaps of 3–4 h were observed),
    # so ask for three staggered slots an hour; the page labels freshness itself.
    - cron: '3,23,43 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch official AQI snapshot (server-side only)
        env:
          # MOENV_API_KEY is preferred; API_KEY is the legacy secret name.
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY || secrets.API_KEY }}
        run: |
          if [ -z "$MOENV_API_KEY" ]; then
            echo "::error::Set the MOENV_API_KEY repository secret; nothing was deployed."
            exit 1
          fi
          npm run fetch:aqi

      - name: Refuse sample, fallback, incomplete, or stale AQI data
        run: npm run validate:aqi

      - name: Verify application
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Verify release artifact carries no credentials
        run: |
          if grep -rEni '(api[_-]?key[[:space:]]*[:=]|authorization[[:space:]]*[:=]|bearer[[:space:]]+[A-Za-z0-9._~-]{12,})' dist; then
            echo "::error::Release artifact contains a credential assignment or bearer token signature."
            exit 1
          fi
          node scripts/validate-aqi-cache.mjs dist/data/aqi-latest.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
